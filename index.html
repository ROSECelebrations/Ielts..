<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Premium Wheel</title>
    <style>
        /* High-end luxury typography */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Deep, luxurious midnight/charcoal gradient */
            background: radial-gradient(circle at top right, #1a1c29 0%, #050508 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 3px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #a9b0c0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .wheel-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        /* Sleek, sharp metallic pointer */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fcf6ba;
            z-index: 10;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.8));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -15px;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #aa771c;
        }

        /* Minimalist Gold Ring */
        .wheel-border {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #d4af37;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.15), inset 0 0 30px rgba(0,0,0,0.9);
            z-index: 5;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.2, 0.0, 0.0, 1); /* Buttery smooth easing */
            transform: rotate(0deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        /* Frosted Glass Center */
        .center-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid #d4af37;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .center-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 10px #fcf6ba;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #050508;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 16px 45px;
            border: none;
            border-radius: 4px; /* Sharp, modern edges */
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.3);
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #e8c962 0%, #b38728 100%);
        }

        .btn-gold:hover::before {
            left: 150%;
        }

        .btn-gold:disabled {
            background: #2a2d3e;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .btn-gold:disabled::before {
            display: none;
        }

        /* Glassmorphism Result Modal */
        #result-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%) scale(0.95);
            opacity: 0;
            pointer-events: none;
            background: rgba(15, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 50px 40px;
            border-radius: 8px;
            text-align: center;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,255,255,0.02);
            min-width: 380px;
        }

        #result-display.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        #result-display h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        #popup-subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 25px;
            color: #a9b0c0;
            line-height: 1.5;
        }

        #code-container {
            margin: 30px 0;
        }

        /* Premium "Engraved" Code Box */
        .code-box {
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(212, 175, 55, 0.5);
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            padding: 18px;
            margin-top: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: #fcf6ba;
            letter-spacing: 4px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
        }

        /* Glassmorphism Landing Page */
        #landing-page {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 60px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: elegantFadeIn 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        #landing-page h1 {
            font-family: 'Cinzel', serif;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            margin-bottom: 20px;
        }

        .phone-number {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: #fcf6ba;
            margin: 25px 0 40px 0;
            letter-spacing: 3px;
        }

        @keyframes elegantFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 500px) {
            .wheel-container { width: 320px; height: 320px; }
            .header h1 { font-size: 2.2rem; }
            .header p { font-size: 0.9rem; }
            #result-display { min-width: 90%; padding: 40px 20px; }
            #landing-page { padding: 40px 20px; }
            .phone-number { font-size: 2rem; }
            .btn-gold { font-size: 0.9rem; padding: 14px 30px; letter-spacing: 2px;}
        }
    </style>
</head>
<body>

    <div class="main-view" id="main-view">
        <div class="header">
            <h1>Exclusive Access</h1>
            <p>Spin to reveal your IELTS privilege</p>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-border"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="center-circle"></div>
        </div>

        <button class="btn-gold" id="spinBtn">Initiate Spin</button>
    </div>

    <div id="result-display">
        <h2 id="popup-title">Offer Unlocked</h2>
        <p id="popup-subtitle"></p>
        
        <div id="code-container">
            <p style="font-size: 0.85rem; color: #788199; text-transform: uppercase; letter-spacing: 2px;">Your Private Access Code</p>
            <div class="code-box" id="popup-code"></div>
        </div>

        <button class="btn-gold" id="popup-action-btn" style="font-size: 0.9rem; padding: 14px 35px;"></button>
    </div>

    <div id="landing-page">
        <h1>Privilege Claimed</h1>
        <p style="font-size: 1.1rem; color: #a9b0c0; margin-bottom: 20px; font-weight: 300;">
            You have successfully secured <strong id="landing-prize" style="color: #d4af37; font-weight: 500;"></strong>. <br><br>
            Access Code: <strong id="landing-code" style="color: #fcf6ba; font-weight: 500; letter-spacing: 1px;"></strong>
        </p>
        
        <p style="font-size: 1rem; color: #788199; line-height: 1.8; font-weight: 300;">To authorize this discount on your account, <br>please forward your code to our concierge via WhatsApp.</p>
        
        <div class="phone-number">8309388689</div>
        
        <a href="#" id="whatsapp-link" target="_blank" class="btn-gold">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.005-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
            Contact Concierge
        </a>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('result-display');
        const mainView = document.getElementById('main-view');
        const landingPage = document.getElementById('landing-page');

        // Dynamic Elements
        const popupTitle = document.getElementById('popup-title');
        const popupSubtitle = document.getElementById('popup-subtitle');
        const codeContainer = document.getElementById('code-container');
        const popupCode = document.getElementById('popup-code');
        const popupActionBtn = document.getElementById('popup-action-btn');
        const landingPrize = document.getElementById('landing-prize');
        const landingCode = document.getElementById('landing-code');
        const whatsappLink = document.getElementById('whatsapp-link');

        // Prize Configuration (7 Options)
        const prizes = [
            "50% OFF", 
            "Better Luck Next Time", 
            "40% OFF", 
            "Another Spin Chance", 
            "30% OFF", 
            "20% OFF", 
            "15% OFF"
        ];
        
        // High-End Luxury Color Palette
        const colors = [
            "#050508", // True Black
            "#d4af37", // Metallic Gold
            "#161824", // Midnight Blue/Charcoal
            "#b38728", // Darkened Gold
            "#0a0b10", // Very Dark Grey
            "#e8c962", // Bright Gold
            "#1a1c29"  // Slate
        ];
        
        // Text contrasting
        const textColors = [
            "#d4af37", // Gold on Black
            "#050508", // Black on Gold
            "#d4af37", // Gold on Midnight
            "#050508", // Black on Dark Gold
            "#d4af37", // Gold on Dark Grey
            "#050508", // Black on Bright Gold
            "#d4af37"  // Gold on Slate
        ];

        // Unique Code Generation Logic (Cycles 1 to 1000)
        let availableNumbers = Array.from({length: 1000}, (_, i) => i + 1);
        let currentGeneratedCode = "";

        function generateUniqueCode() {
            if (availableNumbers.length === 0) {
                availableNumbers = Array.from({length: 1000}, (_, i) => i + 1);
            }
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers[randomIndex];
            availableNumbers.splice(randomIndex, 1);
            
            // Format number to always be 3 digits (e.g., 007, 042, 125) for a premium feel
            const formattedNumber = String(number).padStart(3, '0');
            return `MPL-${formattedNumber}`;
        }

        // Wheel Drawing Logic
        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Extremely subtle inner border
                ctx.lineWidth = 1;
                ctx.strokeStyle = "rgba(212, 175, 55, 0.2)";
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = textColors[i];
                
                // Elegant shadow
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Dynamic text formatting based on length using the premium font
                if (prizes[i].split(' ').length > 2) {
                    ctx.font = "600 13px 'Cinzel', serif";
                    const words = prizes[i].split(' ');
                    const line1 = words.slice(0, 2).join(' ').toUpperCase();
                    const line2 = words.slice(2).join(' ').toUpperCase();
                    ctx.fillText(line1, radius - 40, -10);
                    ctx.fillText(line2, radius - 40, 12);
                } else {
                    ctx.font = "800 26px 'Cinzel', serif";
                    ctx.fillText(prizes[i].toUpperCase(), radius - 40, 0);
                }

                ctx.restore();
            }
        }

        drawWheel();

        // Spin Logic
        let currentRotation = 0;
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "Processing...";
            
            const randomDegree = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegree; 
            currentRotation += totalSpin;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "Initiate Spin";
                
                const normalizedRotation = currentRotation % 360;
                const winningAngle = (270 - normalizedRotation + 360) % 360;
                const winnerIndex = Math.floor(winningAngle / (360 / numSlices));
                
                showResult(prizes[winnerIndex]);
            }, 4000); 
        });

        function showResult(prize) {
            
            if (prize === "Better Luck Next Time") {
                popupTitle.innerText = "No Allocation";
                popupSubtitle.innerHTML = "Unfortunately, no offer was secured on this attempt. We invite you to try again later.";
                
                codeContainer.style.display = "none";
                
                popupActionBtn.innerText = "Return";
                popupActionBtn.onclick = closePopup;
                
            } else if (prize === "Another Spin Chance") {
                popupTitle.innerText = "Complimentary Spin";
                popupSubtitle.innerHTML = "You have been granted an additional attempt. Please spin again.";
                
                codeContainer.style.display = "none";
                
                popupActionBtn.innerText = "Spin Now";
                popupActionBtn.onclick = closePopup;

            } else {
                currentGeneratedCode = generateUniqueCode();
                
                popupTitle.innerText = "Offer Unlocked";
                popupSubtitle.innerHTML = `Yo
