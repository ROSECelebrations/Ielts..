<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Spin Wheel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d2117 0%, #1a3c2a 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #e8dcc4;
            letter-spacing: 1px;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #d4af37;
            z-index: 10;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.5));
        }

        .wheel-border {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.15, 1);
            transform: rotate(0deg);
        }

        .center-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #2e4f3b, #0d2117);
            border: 4px solid #d4af37;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-gold {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            color: #0d2117;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-gold:active {
            transform: translateY(1px);
        }

        .btn-gold:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Result display modal */
        #result-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(13, 33, 23, 0.98);
            border: 2px solid #d4af37;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            min-width: 320px;
        }

        #result-display.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #result-display h2 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        #popup-subtitle {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e8dcc4;
        }

        #code-container {
            margin: 20px 0;
        }

        .code-box {
            background: #1b3d2b;
            border: 1px dashed #d4af37;
            padding: 10px;
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fcf6ba;
            letter-spacing: 2px;
        }

        /* Landing Page View */
        #landing-page {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(13, 33, 23, 0.8);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 1s forwards;
        }

        #landing-page h1 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .phone-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fcf6ba;
            margin: 20px 0 30px 0;
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .wheel-container { width: 300px; height: 300px; }
            .header h1 { font-size: 2.2rem; }
            #landing-page { padding: 30px 15px; }
            .phone-number { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="main-view" id="main-view">
        <div class="header">
            <h1>IELTS Festive Wheel</h1>
            <p>Spin to unlock your exclusive course discount</p>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-border"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="center-circle"></div>
        </div>

        <button class="btn-gold" id="spinBtn">Spin to Win</button>
    </div>

    <div id="result-display">
        <h2 id="popup-title">Congratulations!</h2>
        <p id="popup-subtitle"></p>
        
        <div id="code-container">
            <p style="font-size: 0.9rem; color: #e8dcc4;">Your Unique Access Code:</p>
            <div class="code-box" id="popup-code"></div>
        </div>

        <button class="btn-gold" id="popup-action-btn" style="font-size: 1rem; padding: 10px 25px;"></button>
    </div>

    <div id="landing-page">
        <h1>Claim Your Discount</h1>
        <p style="font-size: 1.2rem; color: #e8dcc4; margin-bottom: 20px;">
            You won <strong id="landing-prize" style="color: #d4af37;"></strong>! <br>
            Your code is: <strong id="landing-code" style="color: #fcf6ba;"></strong>
        </p>
        
        <p style="font-size: 1.1rem;">To apply this discount to your course, <br>redeem it by messaging us on WhatsApp:</p>
        
        <div class="phone-number">8309388689</div>
        
        <a href="#" id="whatsapp-link" target="_blank" class="btn-gold" style="display:flex; align-items:center; gap: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.005-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
            Contact on WhatsApp
        </a>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('result-display');
        const mainView = document.getElementById('main-view');
        const landingPage = document.getElementById('landing-page');

        // Dynamic Elements
        const popupTitle = document.getElementById('popup-title');
        const popupSubtitle = document.getElementById('popup-subtitle');
        const codeContainer = document.getElementById('code-container');
        const popupCode = document.getElementById('popup-code');
        const popupActionBtn = document.getElementById('popup-action-btn');
        const landingPrize = document.getElementById('landing-prize');
        const landingCode = document.getElementById('landing-code');
        const whatsappLink = document.getElementById('whatsapp-link');

        // Updated Prize Configuration (7 Options)
        const prizes = [
            "50% OFF", 
            "Better Luck Next Time", 
            "40% OFF", 
            "Another Spin Chance", 
            "30% OFF", 
            "20% OFF", 
            "15% OFF"
        ];
        
        // Expanded 7-color palette to match the slices
        const colors = ["#1b3d2b", "#c5a059", "#2e4f3b", "#e8dcc4", "#4a7055", "#0d2117", "#d4af37"];
        const textColors = ["#fcf6ba", "#1b3d2b", "#fcf6ba", "#1b3d2b", "#fcf6ba", "#c5a059", "#1b3d2b"];

        // Unique Code Generation Logic (1 to 1000, no repeats)
        let availableNumbers = Array.from({length: 1000}, (_, i) => i + 1);
        let currentGeneratedCode = "";

        function generateUniqueCode() {
            if (availableNumbers.length === 0) {
                return "Maple - 1001"; 
            }
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers[randomIndex];
            availableNumbers.splice(randomIndex, 1);
            return `Maple - ${number}`;
        }

        // Wheel Drawing Logic
        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i];
                ctx.fill();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = textColors[i];
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.shadowBlur = 4;

                // Dynamic text formatting based on length
                if (prizes[i].split(' ').length > 2) {
                    // Split long phrases like "Better Luck Next Time" into two lines
                    ctx.font = "bold 15px 'Poppins', sans-serif";
                    const words = prizes[i].split(' ');
                    const line1 = words.slice(0, 2).join(' ');
                    const line2 = words.slice(2).join(' ');
                    ctx.fillText(line1, radius - 30, -10);
                    ctx.fillText(line2, radius - 30, 10);
                } else {
                    // Standard short text
                    ctx.font = "bold 28px 'Poppins', sans-serif";
                    ctx.fillText(prizes[i], radius - 30, 0);
                }

                ctx.restore();
            }
        }

        drawWheel();

        // Spin Logic
        let currentRotation = 0;
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            
            const randomDegree = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegree;
            currentRotation += totalSpin;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                const normalizedRotation = currentRotation % 360;
                const winningAngle = (270 - normalizedRotation + 360) % 360;
                const winnerIndex = Math.floor(winningAngle / (360 / numSlices));
                
                showResult(prizes[winnerIndex]);
            }, 4000); 
        });

        function showResult(prize) {
            
            // Logic Branching based on outcome
            if (prize === "Better Luck Next Time") {
                popupTitle.innerText = "Oops!";
                popupTitle.style.color = "#c5a059";
                popupSubtitle.innerHTML = "Better luck next time. You didn't win a discount today.";
                
                codeContainer.style.display = "none"; // Hide code box
                
                popupActionBtn.innerText = "Close";
                popupActionBtn.onclick = closePopup;
                
            } else if (prize === "Another Spin Chance") {
                popupTitle.innerText = "Spin Again!";
                popupTitle.style.color = "#d4af37";
                popupSubtitle.innerHTML = "You landed on a free spin! Try your luck once more.";
                
                codeContainer.style.display = "none"; // Hide code box
                
                popupActionBtn.innerText = "Spin Now";
                popupActionBtn.onclick = closePopup;

            } else {
                // A Discount was Won
                currentGeneratedCode = generateUniqueCode();
                
                popupTitle.innerText = "Congratulations!";
                popupTitle.style.color = "#d4af37";
                popupSubtitle.innerHTML = `You have unlocked <strong style="color:#d4af37; font-size:1.3rem;">${prize}</strong> for your IELTS Prep.`;
                
                popupCode.innerText = currentGeneratedCode;
                codeContainer.style.display = "block"; // Show code box
                
                landingPrize.innerText = prize;
                landingCode.innerText = currentGeneratedCode;

                // Update WhatsApp Link
                const phoneNumber = "918309388689"; 
                const message = `Hello! I just spun the IELTS Ivy Wheel and won ${prize}. My unique code is: ${currentGeneratedCode}. How can I redeem this?`;
                whatsappLink.href = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

                popupActionBtn.innerText = "Redeem Now";
                popupActionBtn.onclick = goToLandingPage;
            }

            resultDisplay.classList.add('show');
        }

        // Action when user dismisses a non-winning popup
        function closePopup() {
            resultDisplay.classList.remove('show');
        }

        // Action when user clicks redeem on a winning popup
        function goToLandingPage() {
            resultDisplay.classList.remove('show');
            mainView.style.opacity = '0';
            
            setTimeout(() => {
                mainView.style.display = 'none';
                landingPage.style.display = 'flex';
            }, 500);
        }
    </script>
</body>
</html>
