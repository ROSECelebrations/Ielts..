<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Festive Wheel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Vibrant festive gradient background */
            background: linear-gradient(135deg, #7b001c 0%, #2b0009 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* Festive background pattern (optional radial glow) */
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 60%);
        }

        .main-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #FFD700; /* Bright Gold */
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 2px 4px 5px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.2rem;
            color: #fdf5e6;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2));
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 45px solid #FFD700;
            z-index: 10;
            filter: drop-shadow(0px 5px 4px rgba(0,0,0,0.6));
        }

        .wheel-border {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.6);
            z-index: 5;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.15, 1);
            transform: rotate(0deg);
        }

        .center-circle {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #e53935, #7b001c);
            border: 5px solid #FFD700;
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7), inset 0 0 10px rgba(255,255,255,0.3);
        }

        .btn-gold {
            background: linear-gradient(to right, #FFDF00, #FFF3a0, #FFD700, #FFDF00);
            color: #4a0000;
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 15px 50px;
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5), inset 0 -4px 10px rgba(200, 150, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-gold:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.7), inset 0 -4px 10px rgba(200, 150, 0, 0.5);
        }

        .btn-gold:active {
            transform: translateY(2px);
        }

        .btn-gold:disabled {
            background: #666;
            color: #aaa;
            border-color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Result display modal */
        #result-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #4a0000 0%, #1a0000 100%);
            border: 3px solid #FFD700;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255, 215, 0, 0.2);
            min-width: 350px;
        }

        #result-display.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #result-display h2 {
            font-family: 'Playfair Display', serif;
            color: #FFD700;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #popup-subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fdf5e6;
        }

        #code-container {
            margin: 25px 0;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #FFD700;
            padding: 15px;
            margin-top: 10px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFF3a0;
            letter-spacing: 3px;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        /* Landing Page View */
        #landing-page {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(26, 0, 0, 0.85);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid #FFD700;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 40px rgba(255,215,0,0.15);
            animation: fadeIn 1s forwards;
            backdrop-filter: blur(10px);
        }

        #landing-page h1 {
            font-family: 'Playfair Display', serif;
            color: #FFD700;
            font-size: 3.2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }

        .phone-number {
            font-size: 2.8rem;
            font-weight: 900;
            color: #FFF3a0;
            margin: 20px 0 35px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .wheel-container { width: 320px; height: 320px; }
            .header h1 { font-size: 2.5rem; }
            #landing-page { padding: 30px 20px; }
            .phone-number { font-size: 2.2rem; }
            .btn-gold { font-size: 1.2rem; padding: 12px 30px;}
        }
    </style>
</head>
<body>

    <div class="main-view" id="main-view">
        <div class="header">
            <h1>IELTS Festive Wheel</h1>
            <p>Spin to unlock your exclusive celebration discount!</p>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-border"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="center-circle"></div>
        </div>

        <button class="btn-gold" id="spinBtn">Spin to Win</button>
    </div>

    <div id="result-display">
        <h2 id="popup-title">Congratulations!</h2>
        <p id="popup-subtitle"></p>
        
        <div id="code-container">
            <p style="font-size: 1rem; color: #fdf5e6;">Your Unique Access Code:</p>
            <div class="code-box" id="popup-code"></div>
        </div>

        <button class="btn-gold" id="popup-action-btn" style="font-size: 1.1rem; padding: 12px 30px;"></button>
    </div>

    <div id="landing-page">
        <h1>Claim Your Discount</h1>
        <p style="font-size: 1.3rem; color: #fdf5e6; margin-bottom: 20px;">
            You won <strong id="landing-prize" style="color: #FFD700; font-size:1.5rem;"></strong>! <br><br>
            Your code is: <strong id="landing-code" style="color: #FFF3a0; font-size:1.5rem;"></strong>
        </p>
        
        <p style="font-size: 1.2rem; line-height: 1.6;">To apply this festive discount to your course, <br>redeem it immediately by messaging us on WhatsApp:</p>
        
        <div class="phone-number">8309388689</div>
        
        <a href="#" id="whatsapp-link" target="_blank" class="btn-gold" style="display:flex; align-items:center; justify-content:center; gap: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.005-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
            </svg>
            Message on WhatsApp
        </a>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('result-display');
        const mainView = document.getElementById('main-view');
        const landingPage = document.getElementById('landing-page');

        // Dynamic Elements
        const popupTitle = document.getElementById('popup-title');
        const popupSubtitle = document.getElementById('popup-subtitle');
        const codeContainer = document.getElementById('code-container');
        const popupCode = document.getElementById('popup-code');
        const popupActionBtn = document.getElementById('popup-action-btn');
        const landingPrize = document.getElementById('landing-prize');
        const landingCode = document.getElementById('landing-code');
        const whatsappLink = document.getElementById('whatsapp-link');

        // Prize Configuration (7 Options)
        const prizes = [
            "50% OFF", 
            "Better Luck Next Time", 
            "40% OFF", 
            "Another Spin Chance", 
            "30% OFF", 
            "20% OFF", 
            "15% OFF"
        ];
        
        // Vibrant Festive Color Palette
        const colors = [
            "#E53935", // Vibrant Red
            "#1565C0", // Royal Blue
            "#2E7D32", // Emerald Green
            "#8E24AA", // Bright Purple
            "#FF8F00", // Bright Orange
            "#00838F", // Deep Teal
            "#D81B60"  // Pinkish Red
        ];
        
        // Make text Gold or White depending on background for maximum POP
        const textColors = [
            "#FFD700", // Gold on Red
            "#FFFFFF", // White on Blue
            "#FFD700", // Gold on Green
            "#FFFFFF", // White on Purple
            "#FFFFFF", // White on Orange
            "#FFD700", // Gold on Teal
            "#FFFFFF"  // White on Pinkish Red
        ];

        // Unique Code Generation Logic (Cycles 1 to 1000)
        let availableNumbers = Array.from({length: 1000}, (_, i) => i + 1);
        let currentGeneratedCode = "";

        function generateUniqueCode() {
            // If the array is empty (all 1000 codes used), reset and refill it
            if (availableNumbers.length === 0) {
                availableNumbers = Array.from({length: 1000}, (_, i) => i + 1);
            }
            
            // Pick a random number from the remaining available numbers
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers[randomIndex];
            
            // Remove it from the array so it can't be used again in this cycle
            availableNumbers.splice(randomIndex, 1);
            
            return `Maple - ${number}`;
        }

        // Wheel Drawing Logic
        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Optional: Add inner border to slices for better definition
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(255, 215, 0, 0.3)";
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = textColors[i];
                // Strong text shadow for popping effect
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Dynamic text formatting based on length
                if (prizes[i].split(' ').length > 2) {
                    ctx.font = "bold 16px 'Poppins', sans-serif";
                    const words = prizes[i].split(' ');
                    const line1 = words.slice(0, 2).join(' ');
                    const line2 = words.slice(2).join(' ');
                    ctx.fillText(line1, radius - 35, -10);
                    ctx.fillText(line2, radius - 35, 12);
                } else {
                    ctx.font = "800 32px 'Poppins', sans-serif";
                    ctx.fillText(prizes[i], radius - 35, 0);
                }

                ctx.restore();
            }
        }

        drawWheel();

        // Spin Logic
        let currentRotation = 0;
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            
            const randomDegree = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegree; // 5 full spins + random degree
            currentRotation += totalSpin;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                const normalizedRotation = currentRotation % 360;
                const winningAngle = (270 - normalizedRotation + 360) % 360;
                const winnerIndex = Math.floor(winningAngle / (360 / numSlices));
                
                showResult(prizes[winnerIndex]);
            }, 4000); 
        });

        function showResult(prize) {
            
            // Logic Branching based on outcome
            if (prize === "Better Luck Next Time") {
                popupTitle.innerText = "Oops!";
                popupTitle.style.color = "#FF8F00"; // Orange
                popupSubtitle.innerHTML = "Better luck next time. You didn't win a discount today.";
                
                codeContainer.style.display = "none";
                
                popupActionBtn.innerText = "Close";
                popupActionBtn.onclick = closePopup;
                
            } else if (prize === "Another Spin Chance") {
                popupTitle.innerText = "Spin Again!";
                popupTitle.style.color = "#FFD700"; // Gold
                popupSubtitle.innerHTML = "You landed on a free spin! Try your luck once more.";
                
                codeContainer.style.display = "none";
                
                popupActionBtn.innerText = "Spin Now";
                popupActionBtn.onclick = closePopup;

            } else {
                // A Discount was Won
                currentGeneratedCode = generateUniqueCode();
                
                popupTitle.innerText = "Congratulations!";
                popupTitle.style.color = "#FFD700";
                popupSubtitle.innerHTML = `You have unlocked <strong style="color:#FFD700; font-size:1.4rem; text-shadow: 0 0 5px rgba(255,215,0,0.5);">${prize}</strong> for your IELTS Prep.`;
                
                popupCode.innerText = currentGeneratedCode;
                codeContainer.style.display = "block";
                
                landingPrize.innerText = prize;
                landingCode.innerText = currentGeneratedCode;

                // Update WhatsApp Link
                const phoneNumber = "918309388689"; 
                const message = `Hello! I just spun the IELTS Festive Wheel and won ${prize}. My unique code is: ${currentGeneratedCode}. How can I redeem this?`;
                whatsappLink.href = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

                popupActionBtn.innerText = "Redeem Now";
                popupActionBtn.onclick = goToLandingPage;
            }

            resultDisplay.classList.add('show');
        }

        function closePopup() {
            resultDisplay.classList.remove('show');
        }

        function goToLandingPage() {
            resultDisplay.classList.remove('show');
            mainView.style.opacity = '0';
            
            setTimeout(() => {
                mainView.style.display = 'none';
                landingPage.style.display = 'flex';
            }, 500);
        }
    </script>
</body>
</html>
